services:
  couchdb:
    image: couchdb:3.5
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./init.sh:/opt/couchdb/init.sh
      - ./init_asset_data.py:/couchdb/init_asset_data.py
      - ./init_wo.py:/couchdb/init_wo.py
      - ./sample_data:/sample_data
    command: ["bash", "/opt/couchdb/init.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:password", "http://localhost:5984/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  couchdb-data:
