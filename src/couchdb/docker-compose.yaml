services:
  couchdb:
    image: couchdb:2.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:password", "http://localhost:5984/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  couchdb-data:
