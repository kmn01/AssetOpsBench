[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assetopsbench-knowledge"
version = "0.1.0"
description = "Knowledge Plugin MCP Server - ChromaDB Vector Indexing"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=1.3.0",
    "fastmcp>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "reportlab>=4.0.0",
    "pdfplumber>=0.8.0",
    "PyPDF2>=3.0.0",
]

[project.scripts]
knowledge-mcp-server = "src.servers.knowledge.main:main"
